<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4F7F5"/>
      <stop offset="100%" stop-color="#DCE6E0"/>
    </linearGradient>
    <radialGradient id="bloom_glow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="600" height="720" fill="url(#bg_grad)"/>

  <!-- Subtle Floral Glow -->
  <circle cx="300" cy="330" r="230" fill="url(#bloom_glow)"/>

  <!-- Aesthetic Framing Border -->
  <rect x="24" y="24" width="552" height="672" fill="none" stroke="#111111" stroke-width="1" stroke-opacity="0.15"/>
  <rect x="30" y="30" width="540" height="660" fill="none" stroke="#111111" stroke-width="0.5" stroke-opacity="0.1"/>

  <!-- Botanical Bouquet Illustration -->
  <g id="bouquet" filter="url(#shadow)" transform="translate(300, 340)">
    <!-- Stems wrapping & Kraft wrap -->
    <path d="M-45 130 L-70 70 L70 70 L45 130 Z" fill="rgba(0,0,0,0.06)" stroke="#193629" stroke-width="1.5" stroke-opacity="0.4"/>
    <path d="M-15 130 L-5 210 M15 130 L5 210 M0 130 L0 220" stroke="#193629" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <!-- Wrap tie ribbon -->
    <rect x="-50" y="125" width="100" height="8" rx="4" fill="#2D5A46"/>

    <!-- Foliage / Leaves -->
    <path d="M-110 50 C-170 30 -160 -40 -100 -20 C-60 -5 -70 30 -110 50 Z" fill="#2D5A46" opacity="0.75"/>
    <path d="M110 50 C170 30 160 -40 100 -20 C60 -5 70 30 110 50 Z" fill="#2D5A46" opacity="0.75"/>
    <path d="M-70 -70 C-120 -120 -80 -170 -30 -130 C-10 -110 -30 -70 -70 -70 Z" fill="#2D5A46" opacity="0.6"/>
    <path d="M70 -70 C120 -120 80 -170 30 -130 C10 -110 30 -70 70 -70 Z" fill="#2D5A46" opacity="0.6"/>

    <!-- Left Floral Bloom -->
    <g transform="translate(-75, 10)">
      <circle cx="0" cy="0" r="54" fill="#FFFFFF" stroke="#193629" stroke-width="2"/>
      <circle cx="-10" cy="-6" r="38" fill="none" stroke="#193629" stroke-width="1.8"/>
      <circle cx="5" cy="5" r="24" fill="none" stroke="#193629" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="10" fill="#2D5A46"/>
    </g>

    <!-- Right Floral Bloom -->
    <g transform="translate(75, 10)">
      <circle cx="0" cy="0" r="54" fill="#FFFFFF" stroke="#193629" stroke-width="2"/>
      <circle cx="10" cy="-6" r="38" fill="none" stroke="#193629" stroke-width="1.8"/>
      <circle cx="-5" cy="5" r="24" fill="none" stroke="#193629" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="10" fill="#2D5A46"/>
    </g>

    <!-- Upper Center Bloom -->
    <g transform="translate(0, -65)">
      <circle cx="0" cy="0" r="62" fill="#FFFFFF" stroke="#193629" stroke-width="2"/>
      <!-- Multi-layered peony petals -->
      <path d="M-40 0 C-40 -35 40 -35 40 0 C30 30 -30 30 -40 0 Z" fill="none" stroke="#193629" stroke-width="1.8"/>
      <path d="M-25 -10 C-25 -25 25 -25 25 -10 C20 15 -20 15 -25 -10 Z" fill="none" stroke="#193629" stroke-width="1.8"/>
      <circle cx="0" cy="-6" r="8" fill="#2D5A46"/>
    </g>

    <!-- Central Focal Big Bloom -->
    <g transform="translate(0, 15)">
      <circle cx="0" cy="0" r="70" fill="#FFFFFF" stroke="#193629" stroke-width="2.2"/>
      <path d="M-50 -10 C-50 -45 50 -45 50 -10 C40 38 -40 38 -50 -10 Z" fill="none" stroke="#193629" stroke-width="1.8"/>
      <path d="M-32 -5 C-32 -30 32 -30 32 -5 C25 25 -25 25 -32 -5 Z" fill="none" stroke="#193629" stroke-width="1.8"/>
      <circle cx="0" cy="-3" r="14" fill="#2D5A46"/>
      <circle cx="0" cy="-3" r="6" fill="#FFFFFF"/>
    </g>

    <!-- Eucalyptus branchlets and sprigs -->
    <g stroke="#193629" stroke-width="1.5" stroke-linecap="round" fill="none">
      <path d="M-100 -20 Q-130 -60 -150 -110"/>
      <circle cx="-135" cy="-65" r="9" fill="#2D5A46" opacity="0.8"/>
      <circle cx="-145" cy="-95" r="7" fill="#2D5A46" opacity="0.8"/>

      <path d="M100 -20 Q130 -60 150 -110"/>
      <circle cx="135" cy="-65" r="9" fill="#2D5A46" opacity="0.8"/>
      <circle cx="145" cy="-95" r="7" fill="#2D5A46" opacity="0.8"/>
    </g>
  </g>

  <!-- Top Palette Tag Badge -->
  <g transform="translate(50, 52)">
    <rect width="180" height="26" rx="13" fill="rgba(0,0,0,0.06)"/>
    <text x="90" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="9" font-weight="700" letter-spacing="1.5" fill="#222222" text-anchor="middle">
      МОНОХРОМ / АРХИТЕКТУРА
    </text>
  </g>

  <!-- Brand Signature Monogram -->
  <g transform="translate(515, 52)">
    <circle cx="18" cy="13" r="14" fill="none" stroke="#111111" stroke-width="1" stroke-opacity="0.3"/>
    <text x="18" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="9" font-weight="700" letter-spacing="1" fill="#111111" text-anchor="middle" opacity="0.7">
      LF
    </text>
  </g>

  <!-- Lower Title Card -->
  <g transform="translate(50, 620)">
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="22" font-weight="700" letter-spacing="0.5" fill="#111111">
      Изумрудный монохром
    </text>
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="11" font-weight="500" letter-spacing="1.5" fill="#777777">
      ЛАВФЛОВЕР • АВТОРСКИЙ СБОРНЫЙ БУКЕТ
    </text>
  </g>
</svg>